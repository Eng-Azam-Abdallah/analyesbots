services:
  postgres:
    image: postgres:16
    container_name: analyes-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: analyes
      POSTGRES_PASSWORD: analyes
      POSTGRES_DB: analyes
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analyes -d analyes"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
